<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="counter-card">
      <h1>Press Button</h1>
      <p class="count" aria-live="polite">0</p>
      <div class="controls">
        <button class="btn btn-plus" type="button" aria-label="Increase count">+</button>
        <button class="btn btn-minus" type="button" aria-label="Decrease count">-</button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
